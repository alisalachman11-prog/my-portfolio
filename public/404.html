<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Alisa Lachman — Product Designer</title>
    <!--
      GitHub Pages has no server-side routing, so deep links like
      /my-portfolio/work/dazl return this 404 page. This script re-encodes the
      requested path into a query string and redirects to index.html, where a
      matching script (see index.html) restores the URL for React Router.

      pathSegmentsToKeep = 1 preserves the "/my-portfolio/" project-page prefix.
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
